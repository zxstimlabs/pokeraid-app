name: Pokeraid

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    # Single source of truth for IDs.
    APP_BUNDLE_ID: app.pokeraid
    # Pyhash LLC, the paid team. The free personal team can't use TestFlight or App Groups.
    DEVELOPMENT_TEAM: 8G6DC3A5B8
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PokeraidKit:
    path: Packages/PokeraidKit

targets:
  Pokeraid:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PokeraidKit
    settings:
      base:
        PRODUCT_NAME: Pokeraid
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        # UI code runs on the main actor unless it opts out.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PokerAid
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # The app only uses standard HTTPS, which is exempt, so App Store Connect skips the export compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme: {}
